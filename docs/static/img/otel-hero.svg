<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <!-- App box -->
  <rect x="20" y="60" width="140" height="80" rx="12" fill="#4285F4" opacity="0.9"/>
  <text x="90" y="95" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="white">Application</text>
  <text x="90" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="white" opacity="0.8">.NET / Java</text>
  
  <!-- Arrow 1 -->
  <path d="M170 100 L240 100" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="238,94 250,100 238,106" fill="#7C4DFF"/>
  
  <!-- SDK box -->
  <rect x="260" y="60" width="120" height="80" rx="12" fill="#7C4DFF" opacity="0.9"/>
  <text x="320" y="95" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="white">OTel SDK</text>
  <text x="320" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="white" opacity="0.8">Auto + Manual</text>
  
  <!-- Arrow 2 -->
  <path d="M390 100 L460 100" stroke="#00BCD4" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="458,94 470,100 458,106" fill="#00BCD4"/>
  
  <!-- Collector box -->
  <rect x="480" y="60" width="120" height="80" rx="12" fill="#00BCD4" opacity="0.9"/>
  <text x="540" y="95" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="white">Collector</text>
  <text x="540" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="white" opacity="0.8">OTLP</text>
  
  <!-- Arrows to backends -->
  <path d="M610 80 L660 50" stroke="#2196F3" stroke-width="2"/>
  <path d="M610 100 L660 100" stroke="#4CAF50" stroke-width="2"/>
  <path d="M610 120 L660 150" stroke="#FF9800" stroke-width="2"/>
  
  <!-- Backend boxes -->
  <rect x="670" y="30" width="110" height="40" rx="8" fill="#2196F3" opacity="0.9"/>
  <text x="725" y="55" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" fill="white">Jaeger</text>
  
  <rect x="670" y="80" width="110" height="40" rx="8" fill="#4CAF50" opacity="0.9"/>
  <text x="725" y="105" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" fill="white">Prometheus</text>
  
  <rect x="670" y="130" width="110" height="40" rx="8" fill="#FF9800" opacity="0.9"/>
  <text x="725" y="155" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" fill="white">Loki</text>
  
  <!-- Signal labels -->
  <text x="645" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#2196F3">Traces</text>
  <text x="645" y="95" text-anchor="middle" font-family="Arial" font-size="9" fill="#4CAF50">Metrics</text>
  <text x="645" y="155" text-anchor="middle" font-family="Arial" font-size="9" fill="#FF9800">Logs</text>
</svg>
