server:
  port: 8080

spring:
  application:
    name: shoptrack-api
  datasource:
    url: jdbc:postgresql://localhost:5432/shoptrack
    username: shoptrack
    password: shoptrack
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
