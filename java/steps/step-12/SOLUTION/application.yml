# Configuration de l'application pour SigNoz
#
# La différence principale avec la config habituelle :
# l'endpoint OTLP pointe directement vers le Collector SigNoz.
# SigNoz utilise les mêmes ports OTLP standards (4317/4318).

server:
  port: 8080

spring:
  application:
    name: shoptrack-api
  datasource:
    url: jdbc:postgresql://localhost:5432/shoptrack
    username: shoptrack
    password: shoptrack
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Configuration OpenTelemetry pour SigNoz
# L'endpoint est le même que le Collector standard (4317 pour gRPC)
# Changez le port si la stack de base tourne encore (ex: 4327)
otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
